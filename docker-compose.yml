services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_rag
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: ai-rag-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_rag?schema=public
      CORS_ORIGIN: http://localhost:3100
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "3101:3001"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - database_node_modules:/app/packages/database/node_modules
    command: >
      sh -c "npm run db:generate --workspace=@repo/database &&
             npm run db:push --workspace=@repo/database &&
             npm run dev --workspace=@repo/api"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: ai-rag-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3101
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3100:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - database_node_modules:/app/packages/database/node_modules
      - web_next_cache:/app/apps/web/.next
    command: npm run dev --workspace=@repo/web

volumes:
  postgres_data:
  node_modules:
  api_node_modules:
  web_node_modules:
  database_node_modules:
  web_next_cache:
